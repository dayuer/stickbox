# ============================================================
#  StickBox 服务端 HTTPS 接口（agent / 设备注册与配对）
#  Path:   /etc/nginx/sites-available/mqtt.stickbox.ai
#  部署:   sudo cp server/deploy/nginx-stickbox.conf /etc/nginx/sites-available/mqtt.stickbox.ai
#          sudo nginx -t && sudo systemctl reload nginx
#  后端:   stickboxd 容器（/opt/stickbox/compose.yml），只监听 127.0.0.1:9443
#  MQTT:   8883 由 stickboxd 直接对外，不经 nginx
#
#  不写 80 端口 server：证书用 webroot 续期，80 的隐式默认 server
#  （conf.d/handmake.ai.conf）已对所有主机名提供 acme-challenge。
#
#  X-Forwarded-For 用 $remote_addr **覆盖**而不是追加：stickboxd 只信任
#  来自 127.0.0.1 的这个头，客户端自己伪造的值不能透传过去，
#  否则配对码按 IP 限流可以被绕过。
# ============================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mqtt.stickbox.ai;

    ssl_certificate /etc/letsencrypt/live/mqtt.stickbox.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mqtt.stickbox.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32k;
    # 设备 mbedTLS 收包缓冲 8KB、不协商 MFL：record 必须 <8KB，否则 OTA 下载失败。
    # 只能放在 server（或 http）层；放进 location 会让 nginx -t 报
    # "ssl_buffer_size directive is not allowed here"。
    ssl_buffer_size 4k;

    location /api/ {
        proxy_pass https://127.0.0.1:9443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 健康检查：只返回 200/503，不含内部信息；stickbox-agent doctor 依赖它
    location = /healthz {
        proxy_pass https://127.0.0.1:9443/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        access_log off;
    }

    # OTA 固件下载（不鉴权，sha256 由 manifest 校验）
    location /fw/ {
        proxy_pass https://127.0.0.1:9443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}
